name: Create release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install UI dependencies
        working-directory: web
        run: npm ci

      - name: Build UI
        working-directory: web
        run: npm run build

      - name: Set release version in package manifest
        run: node .github/actions/bump-manifest-version.js
        env:
          TGT_RELEASE_VERSION: ${{ github.ref_name }}

      - name: Bundle files
        run: |
          mkdir -p ./temp/fa_target/web
          cp ./{LICENSE,README.md,CHANGELOG.md,UPSTREAM.md,fxmanifest.lua,config.lua} ./temp/fa_target/
          cp -r ./{client,server,shared,locales} ./temp/fa_target/
          cp -r ./web/dist ./temp/fa_target/web/
          cd ./temp && zip -r ../fa_target.zip ./fa_target

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: fa_target.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
