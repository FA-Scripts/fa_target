name: Create release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install UI dependencies
        working-directory: web
        run: npm ci

      - name: Build UI
        working-directory: web
        run: npm run build

      - name: Set release version in package manifest
        run: node .github/actions/bump-manifest-version.js
        env:
          TGT_RELEASE_VERSION: ${{ github.ref_name }}

      - name: Bundle files
        run: |
          mkdir -p ./temp/ox_target/web
          cp ./{LICENSE,README.md,CHANGELOG.md,UPSTREAM.md,fxmanifest.lua,config.lua} ./temp/ox_target/
          cp -r ./{client,server,shared,locales} ./temp/ox_target/
          cp -r ./web/dist ./temp/ox_target/web/

          test -f ./temp/ox_target/web/dist/index.html

          while IFS= read -r file; do
            case "$file" in
              LICENSE|README.md|CHANGELOG.md|UPSTREAM.md|fxmanifest.lua|config.lua|client/*|server/*|shared/*|locales/*|web/dist/*) ;;
              *) echo "Unexpected release file: $file" >&2; exit 1 ;;
            esac
          done < <(find ./temp/ox_target -type f -printf '%P\n')

          cd ./temp && zip -X -9 -r ../fa_target.zip ./ox_target

      - name: Verify drag-and-drop archive
        run: |
          unzip -t fa_target.zip
          unzip -Z1 fa_target.zip | grep -Fxq 'ox_target/fxmanifest.lua'
          unzip -Z1 fa_target.zip | grep -Fxq 'ox_target/web/dist/index.html'

          if unzip -Z1 fa_target.zip | grep -Eq '(^|/)(node_modules|src|tests|\.git|\.github)(/|$)|(^|/)package(-lock)?\.json$'; then
            echo 'Development-only files found in fa_target.zip' >&2
            exit 1
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: fa_target.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
